name: Unity Test

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  unity-test:
    name: Unity Tests
    uses: Narazaka/vpm-repos/.github/workflows/gameci.yml@main
    permissions:
      checks: write
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    with:
      unity: 2022.3.22f1
      vrcsdk-type: worlds
      vrcsdk-version: 3.10.2
      repos: |
        https://vpm.narazaka.net/index.json
      assemblyNames: Narazaka.VRChat.TagMarker.Tests.Editor
      assemblyFilters: +Narazaka.VRChat.TagMarker.*,-Narazaka.VRChat.TagMarker.Tests.Editor
